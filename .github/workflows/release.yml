name: ContraCounter Auto-Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_release:
    name: Compilar y Publicar Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Configurar o Generar Keystore para Release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando release.keystore desde secreto..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "Generando keystore de firma automática para la release..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias contracounter \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass contracounter \
              -keypass contracounter \
              -dname "CN=ContraCounter, OU=ContratopDev, O=ContratopDev, L=Madrid, ST=Madrid, C=ES"
          fi

      - name: Compilar Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'contracounter' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'contracounter' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'contracounter' }}
        run: ./gradlew assembleRelease

      - name: Extraer Versión del Proyecto
        id: extract_version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | head -n 1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Versión detectada: $VERSION"

      - name: Preparar y Renombrar APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk ContraCounter-v${{ env.APP_VERSION }}.apk
          ls -lh ContraCounter-v${{ env.APP_VERSION }}.apk

      - name: Generar o Actualizar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "🔢 ContraCounter v${{ env.APP_VERSION }} — Modo Duelo Cara a Cara ⚔️, Utilidades de Mesa Polihédricas 🎲 y Control Total ✨"
          draft: false
          prerelease: false
          body: |
            ## 🔢 ContraCounter v${{ env.APP_VERSION }} ⚔️🎲⚡
            
            > ¡La mayor actualización de ContraCounter hasta la fecha! La aplicación definitiva para contadores de juegos de mesa, TCG (Magic, Yu-Gi-Oh!, Pokémon, Lorcana, Star Wars), deportes y hábitos, construida en **Jetpack Compose + Material Design 3 (Material You)** para una experiencia nativa y fluida en Android y Google Pixel.
            
            ---
            
            > [!WARNING]
            > ### ⚠️ NOTA DE INSTALACIÓN / ACTUALIZACIÓN DESDE v1.0.0
            > Si venías de la versión **v1.0.0**, Android te mostrará *"Aplicación no instalada"*. Desinstala primero la versión **v1.0.0** e instala este APK. A partir de esta versión, la clave criptográfica de firma es fija y permanente, garantizando que todas las actualizaciones futuras se instalen directamente.
            
            ---
            
            ### ✨ ¿Qué hay de nuevo en la versión ${{ env.APP_VERSION }}?
            
            #### ⚔️ Modo Duelo Cara a Cara (2 Jugadores en Mesa)
            - **Orientación Dividida 180°:** El Jugador 1 se orienta a 180° hacia el rival enfrente de la mesa mientras el Jugador 2 se mantiene a 0°, optimizado para que la cámara frontal y el notch del dispositivo no interfieran con los controles.
            - **Puntuación Gigante y Botones Ergonómicos:** Marcador colosal con botones de ajuste rápido `-5`, `-1`, `+1`, `+5` y Shadow Delta flotante sincronizado.
            - **Sub-contadores de Veneno / Comandante:** Activa contadores secundarios con tope letal en 10 contadores.
            - **Presets de Vida Instantáneos:** Cambia entre 20 HP (MTG Estándar), 30 HP (Commander 1v1 / SW Unlimited), 40 HP (Commander clásico), 8000 LP (Yu-Gi-Oh!), 6 Premios (Pokémon) o introduce vidas personalizadas.
            - **Detección de K.O & Revancha:** Alerta visual y háptica cuando una vida llega a 0 o el veneno a 10 con reinicio al vuelo.
            
            #### 🎲 Utilidades de Mesa Auxiliares (Dados, Moneda y Turno)
            - **Dados Polihédricos con Geometría Real:**
              - Siluetas geométricas auténticas: **▲ D4 (Tetraedro)**, **■ D6 (Cubo)**, **⚂⚂ 2×D6 (Doble Cubo con suma)**, **◆ D8 (Octaedro)**, **⬠ D10 (Trapezoedro)**, **⬟ D12 (Dodecaedro)**, **⬡ D20 (Icosaedro)** y **⚪ D100 (Orbe porcentual)**.
              - Líneas de facetas interiores 3D proyectadas en cada dado.
            - **Animación Material 3 Expressive Motion:**
              - Elevación dinámica de mesa (`4dp` a `16dp`) con sombra proyectada.
              - Volteo y tambaleo 3D en los ejes X, Y y Z con sacudida física.
              - Curva de deceleración orgánica tipo física real (13 frames) con vibración táctil rítmica.
              - Choque e impacto elástico al aterrizar con `Spring` physics y destello luminoso.
              - Badges épicos para **¡CRÍTICO! ⚡** (20 en D20), **¡PIFIA! 💀** (1 en D20), **¡100 PERFECTO! 👑** y **¡MÁXIMO! 🔥**.
            - **Lanzador de Moneda en 3D:** Volteo metálico de 1440° con aterrizaje en Cara 👑 o Cruz ⚔️ y estadísticas de tiradas de sesión.
            - **Sorteo de Primer Turno:** Ruleta rápida y aleatoria para decidir quién empieza la partida.
            
            #### 📜 Historial Completo y Anotaciones
            - **Actividad de Historial Independiente:** Registro cronológico agrupado por días con desglose exacto de hora, minuto y segundo de cada operación (`+X` / `-X`).
            - **Anotaciones In-App:** Añade notas y apuntes de partida directamente desde el modo pantalla completa.
            - **Exportación de Datos:** Comparte y exporta todo tu historial en formato texto o JSON estructurado.
            
            #### 🏆 Metas Límite y Alertas de Victoria / K.O
            - Fija objetivos de puntos (Target) y umbrales mínimos de derrota (K.O) en cualquier contador con alertas automáticas.
            
            #### 📳 Ajustes de Vibración Háptica
            - Conmutador dedicado en el menú de ajustes para activar o desactivar la respuesta háptica táctil en toda la aplicación.
            
            #### 📱 Widget de Escritorio
            - Controla y visualiza tus contadores directamente desde la pantalla de inicio de tu Android.
            
            #### 🎭 Temas Visuales M3
            - Material 3 (Monet Pixel), Modo Poke 💕, Cyberpunk ⚡ y Matcha Esmeralda 🌿.
            
            ---
            
            ### 📲 Instrucciones de Instalación
            
            1. Descarga el archivo adjunto **`ContraCounter-v${{ env.APP_VERSION }}.apk`**.
            2. Ábrelo en tu dispositivo Android y pulsa en **Instalar** (permite la instalación de fuentes desconocidas si tu navegador te lo solicita).
            3. ¡A disfrutar llevando la cuenta con estilo! 🔢✨
            
            ---
            
            *Desarrollado con ❤️ por **ContratopDev*****
          files: ContraCounter-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
